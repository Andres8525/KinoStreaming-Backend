name: Keep backend awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/keep-alive.yml"]

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping the health endpoint every 4 minutes for almost 6 hours
        env:
          HEALTH_URL: ${{ vars.KINO_HEALTH_URL || 'https://kino-backend-alq2.onrender.com/api/health' }}
          DURATION_MINUTES: "350"
          INTERVAL_SECONDS: "240"
        run: |
          end=$((SECONDS + DURATION_MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            curl --silent --show-error --output /dev/null --write-out "%{http_code} in %{time_total}s\n" \
              --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 "$HEALTH_URL" || echo "ping failed"
            sleep "$INTERVAL_SECONDS"
          done
