name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.KINO_HEALTH_URL || 'https://kino-backend-alq2.onrender.com/api/health' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 "$HEALTH_URL"
