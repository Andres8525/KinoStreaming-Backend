spring.application.name=kino-backend
spring.main.banner-mode=off
spring.jmx.enabled=false
server.port=${PORT:8081}

server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kino}
spring.datasource.username=${DB_USERNAME:kino}
spring.datasource.password=${DB_PASSWORD:kino_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

kino.jwt.secret=${JWT_SECRET}
kino.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

kino.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
kino.cors.allow-vercel-previews=${CORS_ALLOW_VERCEL_PREVIEWS:true}
kino.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}

kino.ai.enabled=${AI_ENABLED:false}
kino.ai.provider=${AI_PROVIDER:}
kino.ai.api-key=${AI_API_KEY:}
kino.ai.model=${AI_MODEL:}
kino.ai.base-url=${AI_BASE_URL:}
kino.ai.cache-ttl=${AI_CACHE_TTL:PT5M}
