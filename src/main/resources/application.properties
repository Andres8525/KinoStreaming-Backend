spring.application.name=kino-backend
server.port=${PORT:8081}

# Running behind a reverse proxy in production (Render): trust X-Forwarded-* headers
# and finish in-flight requests before the container stops.
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
spring.lifecycle.timeout-per-shutdown-phase=20s

# Loads KEY=value pairs from backend/.env when it exists (local development only).
# Real environment variables always take precedence over the file.
spring.config.import=optional:file:.env[.properties]

# Local Docker PostgreSQL by default. For Supabase, set DB_URL / DB_USERNAME / DB_PASSWORD
# (see .env.example and README.md).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kino}
spring.datasource.username=${DB_USERNAME:kino}
spring.datasource.password=${DB_PASSWORD:kino_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool: the Supabase free tier limits the number of pooled client connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Required: provide a private secret of at least 32 bytes through the environment.
kino.jwt.secret=${JWT_SECRET}
kino.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated list of origins allowed by CORS.
kino.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# For each https://<project>.vercel.app above, also allow https://<project>-*.vercel.app (deployment and branch URLs).
kino.cors.allow-vercel-previews=${CORS_ALLOW_VERCEL_PREVIEWS:true}
# Allow the Angular dev server on any localhost port, so a local frontend can use the deployed API.
kino.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}

# "Kino IA" trending analyzer. AI_PROVIDER=gemini enables the built-in Google Gemini client (needs AI_ENABLED=true
# and AI_API_KEY); otherwise, or if Gemini fails, Kino writes the summary from its own statistics. See README "Kino IA".
kino.ai.enabled=${AI_ENABLED:false}
kino.ai.provider=${AI_PROVIDER:}
kino.ai.api-key=${AI_API_KEY:}
kino.ai.model=${AI_MODEL:}
kino.ai.base-url=${AI_BASE_URL:}
kino.ai.cache-ttl=${AI_CACHE_TTL:PT5M}
