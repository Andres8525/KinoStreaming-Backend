# Render Blueprint for the Kino backend.
# Render > New > Blueprint > select the KinoStreaming-Backend repository.
# Values marked "sync: false" are requested in the dashboard when the Blueprint is created;
# they are secrets and must never be committed.
services:
  - type: web
    name: kino-backend
    runtime: docker
    plan: free
    # Same AWS region as the Supabase project (us-east-1) to keep database latency low.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase Session pooler (IPv4), e.g.
      # jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Tables are created with src/main/resources/db/supabase/schema.sql.
      - key: DDL_AUTO
        value: validate
      - key: DB_POOL_SIZE
        value: "5"
      # Random secret generated by Render on the first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # Public URL(s) of the Angular frontend, comma-separated, e.g.
      # https://kino-frontend.onrender.com,http://localhost:4200
      - key: CORS_ALLOWED_ORIGINS
        sync: false
