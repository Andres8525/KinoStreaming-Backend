# Render Blueprint for the Kino backend.
# Render > New > Blueprint > select the KinoStreaming-Backend repository.
# Values marked "sync: false" are requested in the dashboard when the Blueprint is created;
# they are secrets and must never be committed.
services:
  - type: web
    name: kino-backend
    runtime: docker
    plan: free
    # Same AWS region as the Supabase project (us-east-1) to keep database latency low.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Supabase Session pooler (IPv4), e.g.
      # jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Tables are created with src/main/resources/db/supabase/schema.sql.
      - key: DDL_AUTO
        value: validate
      - key: DB_POOL_SIZE
        value: "5"
      # Random secret generated by Render on the first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # Public URL(s) of the Angular frontend, comma-separated, without quotes, e.g.
      # https://kino-streamingg-frontend.vercel.app,https://kino-streamingg-frontend-*.vercel.app,http://localhost:4200
      # (* matches Vercel preview deployments). The effective list is logged at startup.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Kino IA. Keep AI_ENABLED=false until an AiTextGenerator implementation is deployed.
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_CACHE_TTL
        value: PT5M
